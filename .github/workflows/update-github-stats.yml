# Nightly: re-fetches GitHub stars, languages, update dates and commits, then rebuilds and redeploys.
# Nothing is committed back to the repository; the fresh data only lives in the deployed build.
name: Update GitHub stats

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with deploy.yml so the nightly refresh and a push never deploy at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular-widgets/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix angular-widgets
      - name: Fetch GitHub metadata and generate github.json
        run: npm run fetch:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Angular widgets
        run: npm run build:angular
      - name: Build SvelteKit site
        run: npm run build
      - name: Verify production output
        run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
