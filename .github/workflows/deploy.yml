name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every day at 03:17 Manila time so the GitHub numbers stay current.
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular-demo/package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Install Angular demo dependencies
        run: npm ci --prefix angular-demo
      - name: Build Angular demo, then the site
        run: npm run build:all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
